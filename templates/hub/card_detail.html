{% extends "base.html" %}

{% block content %}
  <p><a href="{% url 'hub:card-list' %}">Back to cards</a></p>
  <p><a href="{% url 'hub:card-update' card.id %}">Update</a></p>
  <p><a href="{% url 'hub:card-delete' card.id %}">Delete</a></p>

  <h2>{{ card.question }}</h2>
  <p>Status: {{ card.get_status_display }} · {{ card.level }} · {{ card.category }}</p>

  <details>
    <summary>Show answer</summary>
    <p>{{ card.answer }}</p>
  </details>

  <form method="post" action="{% url 'hub:card-set-status' card.id %}">
    {% csrf_token %}
    <button type="submit" name="action" value="know">Know</button>
    <button type="submit" name="action" value="dont_know">Don't know</button>
  </form>
{% endblock %}
