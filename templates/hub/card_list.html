{% extends "base.html" %}

{% block content %}
  <h3><a href="{% url "hub:card-create" %}">Create a new card</a></h3>

  <form action="" method="get">
  {{ search_form }}
  <input type="submit">
</form>

  <ol>
    {% for card in card_list %}

      <li><a href="{% url "hub:card-detail" card.id %}">{{ card.question }}</a> Status: {{ card.status }}</li>
    {% empty %}
      <li>No cards yet. Select a collection to get starter cards.</li>
    {% endfor %}
  </ol>



{% endblock %}
