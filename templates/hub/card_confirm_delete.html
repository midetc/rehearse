{% extends "base.html" %}

{% block content %}
  <h1>Delete Card</h1>

  <p>Are you sure you want to delete the card: {{ card.question}}  ?</p>

  <form method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
  </form>

  <br>
  <a href="{% url "hub:card-list" %}"  class="btn btn-primary">Cancel</a>
{% endblock %}
